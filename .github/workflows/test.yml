name: ROI Workbench validation
on:
  pull_request:
    paths:
      - 'index.html'
      - 'src/**'
      - 'survey/**'
      - 'tests/**'
      - 'package.json'
      - 'server.mjs'
      - 'scripts/**'
      - '.nojekyll'
      - '.github/workflows/test.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: roi-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Node version
        run: node --version
      - name: Test calculation engine
        run: npm test
      - name: Validate static GitHub Pages payload
        run: npm run check:pages
      - name: Chromium Discover layout and navigation acceptance
        run: npm run test:browser
      - name: Upload visual browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: discover-browser-evidence
          path: browser-evidence/*.png
          if-no-files-found: ignore
          retention-days: 5
      - name: Smoke test local preview server
        run: |
          node server.mjs &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" || true' EXIT
          for i in 1 2 3 4 5; do
            if curl -fsS http://127.0.0.1:4173/ -o /tmp/sandler-roi.html; then break; fi
            sleep 1
          done
          grep -q 'Sandler ROI Workbench' /tmp/sandler-roi.html
          curl -fsS http://127.0.0.1:4173/src/roi.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/evidence.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/csv-import.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/story.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/customer-copy.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/customer-files.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/feedback.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/feedback-archive.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/workbench.css -o /dev/null
          curl -fsS http://127.0.0.1:4173/survey/ -o /tmp/sandler-discovery.html
          grep -q 'Customer intake' /tmp/sandler-discovery.html
          curl -fsS http://127.0.0.1:4173/survey/survey.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/survey/survey.css -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/intake-contract.mjs -o /dev/null
          curl -fsS http://127.0.0.1:4173/src/intake-bridge.mjs -o /dev/null
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:4173/secrets)" = 404
