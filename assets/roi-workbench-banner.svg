<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 288" role="img" aria-labelledby="title description">
<title id="title">ROI Workbench</title>
<desc id="description">A schematic showing four value drivers flowing into a calculated return on investment.</desc>
<defs>
<linearGradient id="back" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#21245c"/><stop offset="1" stop-color="#34377f"/></linearGradient>
<linearGradient id="line" x1="0" x2="1"><stop offset="0" stop-color="#00aded"/><stop offset="1" stop-color="#d7f7ff"/></linearGradient>
</defs>
<rect x="0" y="0" width="1200" height="288" rx="18" fill="url(#back)"/>
