<text x="68" y="155" font-size="50" font-family="Arial, sans-serif" font-weight="bold" letter-spacing="-1" fill="#ffffff">ROI WORKBENCH</text>
<text x="68" y="199" font-size="19" font-family="Arial, sans-serif" fill="#b9d1e2">Adjust assumptions. See the math. Explain the tradeoffs.</text>
<text x="68" y="243" font-size="13" font-family="Arial, sans-serif" fill="#a6bbc9">Illustrative scenarios  |  No guaranteed financial outcome</text>
